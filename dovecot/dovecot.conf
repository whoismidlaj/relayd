# Dovecot main configuration for Relayd integration
# Auth is done via HTTP passdb against Relayd's API
# Mail is delivered via LMTP from inbound.py

# ---- Protocols ----
protocols = imap lmtp

# ---- Logging ----
log_path = /dev/stdout
info_log_path = /dev/stdout
debug_log_path = /dev/stdout

# ---- Mail location ----
# Partition mail storage by full email address (%u) to support multiple domains
mail_location = maildir:/var/mail/%u

# ---- Authentication ----
# Disable system users entirely; use only the HTTP passdb
disable_plaintext_auth = no
auth_mechanisms = plain login

passdb {
  driver = passwd-file
  args = /etc/dovecot/passwd
}

userdb {
  driver = static
  # Use explicit numeric uid/gid (5000) matching the vmail user to avoid any permission lookup failures
  args = uid=5000 gid=5000 home=/var/mail/%u
}

# ---- LMTP (for inbound.py delivery) ----
service lmtp {
  inet_listener lmtp {
    address = 0.0.0.0
    port = 2525
  }
}

# ---- IMAP ----
service imap-login {
  inet_listener imap {
    address = 0.0.0.0
    port = 143
  }
  inet_listener imaps {
    address = 0.0.0.0
    port = 993
    ssl = yes
  }
}

# ---- SSL ----
# For production: mount real certs at /etc/ssl/dovecot/
# For now, use self-signed (generated in entrypoint)
ssl = yes
ssl_cert = </etc/ssl/dovecot/server.pem
ssl_key = </etc/ssl/dovecot/server.key
ssl_dh = </etc/ssl/dovecot/dh.pem
ssl_min_protocol = TLSv1.2

# ---- Mailbox autocreation ----
namespace inbox {
  inbox = yes
  separator = /
  prefix = 
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
}
