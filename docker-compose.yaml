version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: relayd-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks: [relayd]

  backend:
    build: ./backend
    container_name: relayd-backend
    restart: unless-stopped
    environment:
      MONGO_URL: "mongodb://mongo:27017"
      DB_NAME: "relayd_db"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production-please-set-a-long-random-string}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@example.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8080}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8080}"
    depends_on: [mongo]
    networks: [relayd]

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: "${PUBLIC_BACKEND_URL:-}"
    container_name: relayd-frontend
    restart: unless-stopped
    depends_on: [backend]
    networks: [relayd]

volumes:
  mongo_data:

networks:
  relayd:
    driver: bridge
