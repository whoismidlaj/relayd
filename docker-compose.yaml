version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: relayd-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks: [relayd]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    container_name: relayd-backend
    restart: unless-stopped
    environment:
      MONGO_URL: "mongodb://mongo:27017"
      DB_NAME: "relayd_db"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production-please-set-a-long-random-string}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@example.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8080}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8080}"
      INTERNAL_SECRET: "${INTERNAL_SECRET:-relayd-internal}"
    depends_on:
      mongo:
        condition: service_healthy
    networks: [relayd]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; r = urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4); sys.exit(0 if r.status == 200 else 1)\""]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: "${PUBLIC_BACKEND_URL:-}"
    container_name: relayd-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [relayd]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build: ./backend
    container_name: relayd-worker
    command: python worker.py
    restart: unless-stopped
    environment:
      MONGO_URL: "mongodb://mongo:27017"
      DB_NAME: "relayd_db"
    depends_on:
      mongo:
        condition: service_healthy
    networks: [relayd]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import pymongo, sys; c = pymongo.MongoClient('mongodb://mongo:27017', serverSelectionTimeoutMS=3000); c.admin.command('ping'); sys.exit(0)\" || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s

  inbound:
    build: ./backend
    container_name: relayd-inbound
    command: python inbound.py
    restart: unless-stopped
    ports:
      - "25:25"
      - "587:587"
    environment:
      MONGO_URL: "mongodb://mongo:27017"
      DB_NAME: "relayd_db"
      DOVECOT_HOST: "dovecot"
      DOVECOT_LMTP_PORT: "2525"
    depends_on:
      mongo:
        condition: service_healthy
    networks: [relayd]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket, sys; s = socket.socket(); s.settimeout(3); s.connect(('127.0.0.1', 25)); s.close(); sys.exit(0)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dovecot:
    build: ./dovecot
    container_name: relayd-dovecot
    restart: unless-stopped
    environment:
      RELAYD_API_URL: "http://backend:8000/api"
      INTERNAL_SECRET: "${INTERNAL_SECRET:-relayd-internal}"
    ports:
      - "143:143"   # IMAP (plain/STARTTLS) — for mail clients
      - "993:993"   # IMAPS (SSL) — recommended for clients
      # Port 2525 (LMTP) is internal only — NOT exposed to host
    volumes:
      - dovecot_mail:/var/mail
    depends_on:
      backend:
        condition: service_healthy
    networks: [relayd]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 143 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mongo_data:
  dovecot_mail:

networks:
  relayd:
    driver: bridge
